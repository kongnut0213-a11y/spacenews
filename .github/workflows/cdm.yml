name: 근접접근(SOCRATES) 수집

on:
  schedule:
    - cron: "27 */3 * * *"   # 3시간마다 (UTC 기준 27분, TLE 수집과 엇갈림)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect          # 뉴스·TLE 수집과 같은 그룹: 동시에 커밋하지 않도록 차례로 실행
  cancel-in-progress: false

jobs:
  cdm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 근접접근 수집
        run: node scripts/cdm.mjs
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cdm.json data/cdm-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "cdm: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
