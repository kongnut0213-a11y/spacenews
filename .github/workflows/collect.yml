name: 우주 동향 데이터 수집

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (UTC 기준 17분, 한국 시간 02:17, 05:17, ...)
  workflow_dispatch:
    inputs:
      force_satcat:
        description: "CelesTrak 위성 집계를 지금 다시 받기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 수집
        run: node scripts/collect.mjs
        env:
          FORCE_SATCAT: ${{ inputs.force_satcat }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}   # 선택: 없으면 Google 번역만 사용
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
