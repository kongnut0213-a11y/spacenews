name: GCAT 카탈로그 수집

on:
  schedule:
    - cron: '23 20 * * *'   # 매일 05:23 KST (GCAT은 보통 주 1~2회 갱신)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit          # 다른 수집 작업과 동시에 push하지 않도록
  cancel-in-progress: false

jobs:
  gcat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: GCAT 받기·정리
        run: python scripts/gcat_update.py data
      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gcat.tsv data/gcat-meta.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "GCAT 카탈로그 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i*15))
          done
          exit 1
