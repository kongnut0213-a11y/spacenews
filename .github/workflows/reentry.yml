name: 재진입 자료 수집

on:
  schedule:
    - cron: "37 */3 * * *"   # 3시간마다 (UTC 기준 37분, 다른 수집과 엇갈림)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect          # 다른 수집 작업과 같은 그룹: 동시에 커밋하지 않도록 차례로 실행
  cancel-in-progress: false

jobs:
  reentry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 재진입 자료 수집
        run: node scripts/reentry.mjs
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reentry.json data/reentry-recent.json data/reentry-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "reentry: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
