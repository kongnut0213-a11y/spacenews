name: 궤도분석 TLE 수집

on:
  schedule:
    - cron: "47 */3 * * *"   # 3시간마다 (UTC 기준 47분, 한국 시간 00:47, 03:47, 06:47, ...)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect          # 뉴스 수집과 같은 그룹: 동시에 커밋하지 않도록 차례로 실행
  cancel-in-progress: false

jobs:
  tle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: TLE 수집
        run: node scripts/tle.mjs
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tle.json data/tle.txt data/tle-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "tle: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
