<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Trend Update</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#000;--pn:#0b0b0d;--tx:#e8ecf4;--mu:#98a2b5;--bd:#23262e;--ac:#6ea2ff;--chip:#1a2338;--nav:#000;--navtx:#dbe6ff;--dk:#07090f;--dktx:#eaf0ff;--dkmu:#9fb2d6;--dkbd:#1f2a44}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
nav{border-bottom:1px solid var(--bd);background:var(--nav);color:var(--navtx);display:flex;align-items:center;gap:18px;padding:10px 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:1px;color:#fff;white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:400;letter-spacing:0;color:var(--dkmu)}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--navtx);font:inherit;padding:8px 10px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:#fff;font-weight:700;border-color:#4d8dff}
nav input{font:inherit;border:1px solid var(--dkbd);background:#0d2447;color:#fff;border-radius:18px;padding:6px 14px;width:200px;max-width:100%}
.dt{font-size:12px;color:var(--dkmu);white-space:nowrap}
.upb{font:inherit;color:#fff;background:#2f6fe0;border:0;border-radius:18px;padding:6px 14px;cursor:pointer;white-space:nowrap}.upb:disabled{opacity:.6}
.bl{margin:0 0 6px;padding-left:18px;font-size:13px;color:var(--mu)}.dk .bl{color:var(--dkmu)}.og{font-size:11px;color:var(--mu);opacity:.75;margin-bottom:4px}
nav input{flex:1;min-width:160px;max-width:460px}
.rs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.rs select,.rs button{font:inherit;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:8px;padding:3px 8px}
.hero{background:radial-gradient(ellipse at 85% 120%,#2f7bff 0%,#0b2a63 38%,#050b1a 75%);color:#fff;padding:36px 22px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0;color:#c3d3f5}
.w{max-width:1200px;margin:0 auto;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.two,.three{grid-template-columns:1fr!important}}
.p{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px}
.p.dk{background:var(--dk);border-color:var(--dkbd);color:var(--dktx)}
.ph{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.ph h2{margin:0;font-size:19px}
.ph span{font-size:12px;color:var(--mu)}
.dk .ph span{color:var(--dkmu)}
.a{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.dk .a{border-color:var(--dkbd)}
.th{flex:0 0 84px;height:64px;border-radius:8px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#123a7a,#050b1a)}
.a h3{margin:0 0 3px;font-size:15px}
.a p{margin:0 0 5px;font-size:13px;color:var(--mu)}
.dk .a p{color:var(--dkmu)}
.m{font-size:12px;color:var(--mu);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.dk .m{color:var(--dkmu)}
.m a{color:var(--ac);text-decoration:none;font-weight:600}
.dk .m a{color:#8fb7ff}
.tag{font-size:11px;padding:1px 9px;border-radius:10px;background:var(--chip);color:var(--ac)}
.dk .tag{background:#1b3a70;color:#bcd3ff}
.three{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px;margin-top:16px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp div{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--mu)}
.kp b{display:block;font-size:22px;color:var(--ac)}
.l{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--bd);align-items:baseline}
.l:first-of-type{border-top:0}
.l i{font-style:normal;background:var(--ac);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;white-space:nowrap}
.ins{background:linear-gradient(135deg,#0d2a63,#0a1a36);color:#fff;border-radius:14px;padding:16px}
.ins h2{margin:0 0 6px;font-size:17px}
.ins p{color:#c3d3f5;font-size:13px}
.ins button{font:inherit;color:#fff;background:none;border:1px solid #6e8fd0;border-radius:8px;padding:6px 14px;cursor:pointer}
.note{font-size:12px;color:var(--mu);margin:14px 0}
.empty{padding:14px 0;color:var(--mu)}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.w{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 16px;width:100%;max-width:none;margin:0}
.two{flex:1;min-height:0}
.two .p,#sr{display:flex;flex-direction:column;min-height:0}
#L,#R,#so{flex:1;min-height:0;overflow-y:auto}
#so{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px;align-content:start}
.a{padding:8px 0;gap:10px}.th{flex:0 0 50px;height:42px;font-size:21px}.a h3{font-size:14px;margin:0 0 2px}.bl{font-size:12px;margin:0 0 3px}.m{font-size:11px}.ph{margin-bottom:2px}.ph h2{font-size:17px}
.kp{grid-template-columns:repeat(4,1fr)}.kp b{font-size:19px}.kp div{padding:6px 8px}
.three{grid-template-columns:1fr 1fr;margin:0;gap:12px}
.three .p:nth-child(2){display:grid;grid-template-columns:1fr 1fr;column-gap:14px;align-content:start}
.three .p:nth-child(2) .ph,.three .p:nth-child(2) .m{grid-column:1/-1}
.three .l{padding:4px 0;font-size:12.5px}
.note{margin:0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:820px){html,body{height:auto}body{overflow:auto}.w{display:block}.two,.three{display:grid;gap:12px}.two{margin-bottom:12px}#L,#R,#so{overflow:visible}#so{grid-template-columns:1fr}.note{white-space:normal}.kp{grid-template-columns:repeat(2,1fr)}}
.logo{font-size:16px;letter-spacing:1.5px}#tall{margin-left:auto}
.p.dk{background:rgba(70,200,120,.13);border-color:rgba(90,210,130,.38)}
.dk .a{border-color:rgba(90,210,130,.25)}
.dk .tag{background:rgba(90,210,130,.2);color:#b8f0cc}
.dk .m a{color:#8fe0ad}
.tb{font:inherit;font-size:11px;border:1px solid var(--bd);background:none;color:var(--ac);border-radius:10px;padding:1px 9px;cursor:pointer}
.dk .tb{color:#8fe0ad;border-color:rgba(90,210,130,.5)}
#gen{background:rgba(255,214,70,.10);border-color:rgba(255,214,70,.38)}
#gen .a{border-color:rgba(255,214,70,.22)}
#gen .tag{background:rgba(255,214,70,.18);color:#ffe9a0}
#gen .m a{color:#ffd966}
#gen .tb{color:#ffd966;border-color:rgba(255,214,70,.5)}
.th{position:relative;overflow:hidden;flex:0 0 72px;height:52px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kp b.ok{color:#5fd68a}.kp b.wn{color:#ffd166}.kp b.bd{color:#ff6b6b}
.a{cursor:pointer}.a.sel{background:rgba(110,162,255,.16);box-shadow:inset 3px 0 0 var(--ac);border-radius:8px;padding-left:10px;animation:fl 1.1s ease-out}
#gen .a.sel{background:rgba(255,214,70,.2);box-shadow:inset 3px 0 0 #ffd966}
.p.dk .a.sel{background:rgba(90,210,130,.2);box-shadow:inset 3px 0 0 #8fe0ad}
@keyframes fl{from{filter:brightness(1.9)}to{filter:none}}

nav{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;background:rgba(2,4,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(160,180,220,.18);padding:8px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:46px;width:auto;filter:drop-shadow(0 0 6px rgba(180,200,255,.25))}
.brand .logo{font-family:Orbitron,-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;line-height:1.35;color:#c9ccd3;white-space:nowrap}
.brand .logo span{display:block;color:#8e94a3;font-size:9.5px;letter-spacing:2.6px}
.ttl{margin:0;font-family:Orbitron,-apple-system,sans-serif;font-weight:800;font-size:24px;letter-spacing:3px;color:#fff;text-align:center;white-space:nowrap;text-shadow:0 0 18px rgba(110,162,255,.55)}
.act{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#tall{margin-left:0}
.p{background:rgba(6,8,16,.74);border-color:rgba(160,180,220,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#gen{background:linear-gradient(rgba(255,214,70,.09),rgba(255,214,70,.09)),rgba(6,8,16,.74)}
.p.dk{background:linear-gradient(rgba(70,200,120,.11),rgba(70,200,120,.11)),rgba(6,8,16,.74)}
.kp div{background:rgba(26,35,56,.75)}
.note{color:#aab3c5;text-shadow:0 1px 2px #000}
.bl{padding-left:2px;list-style:none}.bl li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bl li::before{content:"• ";opacity:.8}
.ph h2{white-space:nowrap;flex:none}.ph span{min-width:0}
.a p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a>div:last-child{min-width:0;flex:1}
.a.sel h3{font-size:18px;line-height:1.4;margin-bottom:4px}
.a.sel .bl,.a.sel p{font-size:14.5px}
.a.sel .bl li{white-space:normal}
.a.sel .og{font-size:12.5px}
.a.sel .m{font-size:12.5px}
.a.sel .th{flex-basis:84px;height:62px;font-size:28px}
@media(max-width:820px){nav{grid-template-columns:1fr;justify-items:center;text-align:center}.act{justify-content:center}.ttl{font-size:20px;order:-1}.brand{order:-2}}

#sat{display:flex;flex-direction:column;min-height:0}
.three #lp{display:flex;flex-direction:column;min-height:0}
.mw{flex:1;min-height:0;display:flex;align-items:center}
.map{width:100%;height:auto;display:block;border-radius:10px}
.map .sea{fill:rgba(4,12,30,.6)}
.map .gr line{stroke:rgba(140,170,230,.12);stroke-width:.6;stroke-dasharray:2 3}.map .gr line.eq{stroke:rgba(140,170,230,.28)}
.map .land{fill:rgba(110,150,230,.22);stroke:rgba(150,185,255,.55);stroke-width:.6}
.mk .dt{fill:#ffd166;stroke:#fff;stroke-width:1.2}.mk.ok .dt{fill:#5fd68a}
.mk .pl{fill:none;stroke:#ffd166;stroke-width:1.5}
.mk .lb{font-size:14px;font-weight:600;fill:#eef3ff;paint-order:stroke;stroke:rgba(2,6,16,.9);stroke-width:3.5px;stroke-linejoin:round}
.mk .dd{fill:#ffd166;font-weight:800}.mk.ok .dd{fill:#8fe0ad}.mk .okt{fill:#5fd68a}
.ls .tri{fill:#9fb6e8;stroke:#0a1430;stroke-width:1}.ls.kr .tri{fill:#6ea2ff;stroke:#fff}
.ls .ln{font-size:12px;fill:#b9c6e3;paint-order:stroke;stroke:rgba(2,6,16,.9);stroke-width:3px;stroke-linejoin:round}.ls.kr .ln{fill:#9cc2ff;font-weight:800;font-size:13px}
.ls:hover .ln{fill:#fff}.mk .sn{font-size:11.5px;font-weight:500;fill:#b9c6e3}
.mk{cursor:default}.mk:hover .lb{fill:#fff}.mk:hover .dt{r:7}
.stw{min-height:0;flex:1;display:flex;flex-direction:column;gap:10px}
.stg{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tt div{background:rgba(26,35,56,.78);border:1px solid rgba(160,180,220,.18);border-radius:10px;padding:6px 10px;min-width:0}
.tt small{display:block;font-size:12.5px;color:var(--mu)}.tt b{display:block;font-size:22px;line-height:1.25;color:#fff;font-variant-numeric:tabular-nums}
.tt i{display:block;font-style:normal;font-size:12px;color:var(--mu);line-height:1.35}.tt .up{color:#5fd68a}.tt .dn{color:#ff6b6b}
@media(max-width:820px){.stg,.tt{grid-template-columns:1fr}}
.st{width:100%;height:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.st th{color:var(--mu);font-size:13px;font-weight:600;text-align:right;padding:3px 7px;border-bottom:1px solid var(--bd);white-space:nowrap}
.st td{text-align:right;padding:2px 7px;border-top:1px solid rgba(160,180,220,.1);white-space:nowrap}
.st th:first-child,.st td:first-child{text-align:left}
.st tr.kr td{background:rgba(110,162,255,.16);font-weight:700}
.st tr.tot td{font-weight:700;color:#e8ecf4;background:rgba(255,255,255,.04)}.st tr.t0 td{border-top:2px solid rgba(160,180,220,.45)}
.st .up{color:#5fd68a}.st .dn{color:#ff6b6b}.st .z{color:var(--mu)}
@media(max-width:820px){.stw{max-height:none}}
/* ---- 번역 전/후 카드 높이 고정 ---- */
.a h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a p,.a .bl{font-size:12.5px;line-height:1.5;height:3em;margin:0 0 4px;overflow:hidden}
.a .bl li{display:block;line-height:1.5;margin:0}
.a .m{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
.a .m>span,.a .m>button{flex:none}
.a .m>.src{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.a.sel h3{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;height:2.8em;line-height:1.4}
.a.sel p,.a.sel .bl{font-size:14.5px;height:4.5em}
.a.sel p{-webkit-line-clamp:3}
.a.sel .bl li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden}
/* ---- 선택·번역 시 카드/패널 크기 불변 ---- */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two>.p,.three>.p{min-width:0}
.a{padding-left:8px;padding-right:8px}
.a h3{height:22px;line-height:22px;margin:0 0 2px}
.a p,.a .bl{height:40px;line-height:20px;margin:0 0 4px}
.a .bl li{line-height:20px}
.a .m{height:20px;align-items:center}
.a.sel{padding-left:8px;padding-right:8px}
.a.sel h3{display:block;white-space:nowrap;-webkit-line-clamp:unset;font-size:15.5px;height:22px;line-height:22px;margin:0 0 2px}
.a.sel p,.a.sel .bl{font-size:13px;height:40px;line-height:20px;margin:0 0 4px}
.a.sel p{-webkit-line-clamp:2}
.a.sel .bl li{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-line-clamp:unset;line-height:20px}
.a.sel .m{font-size:11px;height:20px}
.a.sel .th{flex:0 0 72px;height:52px;font-size:21px}
/* ---- 하단 바: 한국 위성 변동 + 신규 발사 흐름글 ---- */
#bt{flex:none;background:rgba(2,4,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid rgba(160,180,220,.22);font-size:12.5px}
#kr,#tk{display:flex;align-items:center;height:28px;overflow:hidden}
#kr{border-bottom:1px solid rgba(160,180,220,.12)}
#kr b,#tk b{flex:none;padding:0 12px;white-space:nowrap}
#tk b{color:#ffd166}#kr b{color:#9cc2ff}
#kr .tkt{color:#cfe0ff}
.map .ldr{fill:none;stroke:rgba(255,209,102,.75);stroke-width:1}.map .ls .ldr{stroke:rgba(185,198,227,.6)}
.tkv{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.tkt{display:inline-block;padding-left:100%;animation:tkm 60s linear infinite;color:#e8ecf4}
.tkt:hover{animation-play-state:paused}
@keyframes tkm{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.mk.fl .dt{fill:#ff6b6b}.mk.fl .dd{fill:#ff8c8c}
.mk .sc,.mk .sc .dd,.mk .sc .okt{fill:#8fe0ad;fill-opacity:.6}.mk.ok{opacity:.6}.mk.ok .lb .sn{fill:#8fe0ad}.mk.ok .dt{fill:#5fd68a;stroke:rgba(255,255,255,.6)}
.tsc{color:#8fe0ad;opacity:.6}
/* ---- 번역 카드: 글자 잘림 없이 줄바꿈 ---- */
.a{word-break:keep-all;overflow-wrap:anywhere}
.a.tr h3,.a.tr.sel h3{display:block;white-space:normal;height:auto;line-height:20px;overflow:visible;text-overflow:clip;-webkit-line-clamp:unset}
.a.tr p,.a.tr .bl,.a.tr.sel p,.a.tr.sel .bl{display:block;height:auto;overflow:visible;-webkit-line-clamp:unset}
.a.tr .bl li,.a.tr.sel .bl li{display:block;white-space:normal;overflow:visible;text-overflow:clip;-webkit-line-clamp:unset}
#sts{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#sts.er{color:#ff8c8c}
/* ---- 제목·선택 흐림 ---- */
.ttl{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Orbitron,sans-serif;font-size:26px;letter-spacing:4px;line-height:1.05}
.ttl small{display:block;margin-top:3px;font-family:Orbitron,-apple-system,sans-serif;font-size:10.5px;font-weight:600;letter-spacing:4px;opacity:.7;text-shadow:none}
.a{transition:opacity .2s,filter .2s}
body.hs .a:not(.sel){opacity:.3;filter:grayscale(.45)}
body.hs .a:not(.sel):hover{opacity:.7}
/* ---- 선택 기사 글자 확대 ---- */
.a.sel h3{font-size:18px;height:26px;line-height:26px}
.a.sel p,.a.sel .bl{font-size:15px;height:48px;line-height:24px}
.a.sel .bl li{line-height:24px}
.a.sel .m{font-size:12px;height:22px}
.a.tr.sel h3{line-height:25px}.a.tr.sel p,.a.tr.sel .bl,.a.tr.sel .bl li{line-height:23px}
#L,#R{scrollbar-width:thin}
</style>
