  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  if(!window.crypto||!crypto.subtle){msg.textContent="이 브라우저에서는 열 수 없습니다(보안 연결 또는 최신 브라우저 필요).";go.disabled=true;return}
  f.addEventListener("submit",async function(e){
    e.preventDefault();if(!pw.value)return;
    go.disabled=true;msg.style.color="#98a2b5";msg.textContent="확인 중…";
    try{
      var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]);
      var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
      var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(ENC.iv)},key,u8(ENC.data)));
      pw.value="";document.open();document.write(html);document.close();
    }catch(err){
      msg.style.color="#ff8a8a";msg.textContent="비밀번호가 맞지 않습니다.";go.disabled=false;pw.select();
    }
  });
})();
</script>
</body>
</html>
